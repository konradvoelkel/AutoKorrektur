name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Every action is pinned by commit SHA with its tag in a comment (PLAYBOOK §3.2): a moving major
# tag let a runner-image change turn a green sibling workflow red with zero repo changes. Bump by
# resolving the new tag with `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` and reading its
# release notes; all of these declare `runs.using: node24`, so no FORCE_JAVASCRIPT_ACTIONS_TO_NODE24.
# gradle/actions stays on the v5 line on purpose: v6 moved its caching into a proprietary
# component whose Terms of Use one accepts by upgrading -- that is the owner's call, not a bump.

jobs:
  build-test-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The ML models and the test fixtures live on a GitHub release, not in git
      # (scripts/assets.manifest). Cache them keyed by the manifest so a run only downloads when
      # a hash actually changes; every Gradle task needs them.
      - name: Cache large build assets
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .assets-cache
          key: assets-${{ hashFiles('scripts/assets.manifest') }}

      - name: Fetch large build assets
        run: scripts/fetch_assets.sh

      # The same major as gradle/gradle-daemon-jvm.properties pins, so Gradle's daemon runs on
      # this JDK instead of looking for a download.
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # Product flavors were introduced in docs/PRODUCT_TIERS.md; CI validates the
      # `full` flavor (all FEATURE_* flags true, all ABIs) since it's the only one that
      # exercises every code path and matches the pre-flavor app exactly — no coverage
      # regression from adding flavors. `core` (the actual Play Store candidate) is validated
      # separately below via its release bundle build.
      - name: Run Android Lint
        run: ./gradlew lintFullDebug

      - name: Run Android Unit Tests & Generate JaCoCo Coverage
        run: ./gradlew testFullDebugUnitTest jacocoTestReport

      - name: Upload Test & Coverage Reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-and-coverage-reports
          path: |
            app/build/reports/tests/
            app/build/reports/jacoco/
            app/build/reports/lint-results-fullDebug.html
          if-no-files-found: ignore

      - name: Enable KVM group perms for Hardware Acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Headless Android Emulator Instrumented Tests
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedFullDebugAndroidTest

      # A red emulator run is unreadable from the log alone (Laberampel §52.1); the HTML report
      # names the test and the assertion.
      - name: Upload Instrumented Test Report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: instrumented-test-report
          path: app/build/reports/androidTests/
          if-no-files-found: ignore

      - name: Build Production Release App Bundle (AAB)
        run: ./gradlew :app:bundleCoreRelease

      - name: Upload Release App Bundle
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-app-bundle
          path: app/build/outputs/bundle/coreRelease/*.aab
          if-no-files-found: ignore
