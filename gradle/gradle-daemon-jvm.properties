# Written by hand, not by `updateDaemonJvm` (PLAYBOOK 3.1): the version only, and deliberately
# no vendor and no toolchain download URLs, so Gradle runs its daemon on an installed JDK 21 --
# ~/.gradle/jdks or Android Studio's on the owner's machine, setup-java's on CI -- or fails with
# a clear message instead of fetching an unchecksummed JDK from the network. jvmToolchain(21)
# in app/build.gradle.kts then resolves to the daemon's own JVM.
toolchainVersion=21
